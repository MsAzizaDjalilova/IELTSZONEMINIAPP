# Render Blueprint: faqat backend (API + Telegram bot). Frontend — Vercel'da.
services:
  - type: web
    name: ieltszone-api
    runtime: node
    region: ohio  # Neon bazasi us-east-2 (Ohio) da — eng tez
    plan: free
    buildCommand: npm install && npm run build
    startCommand: node src/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: BOT_USERNAME
        value: ieltszoneminiapp_bot
      - key: WEBAPP_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_SECRET
        generateValue: true
